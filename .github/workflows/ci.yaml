name: OHCL Build and Validation

on:
  pull_request:
    branches:
      - 'product/hcl-main/*'
      - 'project/hcl-dev/*'
  push:
    tags:
      - 'rolling-lts/hcl-main/*'
      - 'rolling-lts/hcl-dev/*'

jobs:
  build_linux:
    name: Build Linux kernel (reproducible)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['x64', 'cvm-x64', 'arm64']
    env:
      # Stable build identity used to derive SOURCE_DATE_EPOCH and metadata.
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: nixos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Need the HEAD commit's timestamp for SOURCE_DATE_EPOCH; depth=1 is sufficient.
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Map ci arch to build args
        id: args
        run: |
          case "${{ matrix.arch }}" in
            x64)
              echo "build_arch=amd64"   >> "$GITHUB_OUTPUT"
              echo "config=Microsoft/hcl-x64.config"   >> "$GITHUB_OUTPUT"
              echo "is_cvm=0"            >> "$GITHUB_OUTPUT"
              ;;
            cvm-x64)
              echo "build_arch=amd64"   >> "$GITHUB_OUTPUT"
              echo "config=Microsoft/hcl-x64.config"   >> "$GITHUB_OUTPUT"
              echo "is_cvm=1"            >> "$GITHUB_OUTPUT"
              ;;
            arm64)
              echo "build_arch=arm64"   >> "$GITHUB_OUTPUT"
              echo "config=Microsoft/hcl-arm64.config" >> "$GITHUB_OUTPUT"
              echo "is_cvm=0"            >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Merge CVM config fragment
        if: steps.args.outputs.is_cvm == '1'
        run: |
          # Run the merge inside the Nix dev shell so flex/bison/gcc are present
          # and so that scripts/kconfig builds against the same toolchain that
          # will be used for the actual kernel compile.
            nix develop -i \
              -k HOME -k USER -k TERM \
            --command bash -ec './Microsoft/merge-cvm-config.sh'

      - name: Build kernel reproducibly
        env:
          # SOURCE_DATE_EPOCH is derived from the HEAD commit by the pipeline
          # script when not pre-set; exporting it here makes it visible in logs.
          GIT_SHA: ${{ github.sha }}
        run: |
          # The pipeline script copies the source into /tmp/ohcl-kernel-build/src
          # to normalise embedded paths. Place the build dir OUTSIDE the source
          # so it survives that rsync (which excludes ./build, ./out, ./compare).
          BUILD_DIR="${RUNNER_TEMP:-/tmp}/build-output-${{ matrix.arch }}"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

          ./Microsoft/build-hcl-kernel-pipeline.sh \
            --source-dir "$PWD" \
            --build-dir "$BUILD_DIR" \
            --config "${{ steps.args.outputs.config }}" \
            --arch "${{ steps.args.outputs.build_arch }}" \
            --reproducible

      - name: Package artifacts
        run: |
          # Packaging runs inside the Nix shell so the cross objcopy is on PATH
          # for arm64 module stripping.
            nix develop -i \
              -k HOME -k USER -k TERM \
              -k BUILD_DIR \
            --command bash -ec '
              bash ./Microsoft/package-ci-artifacts.sh \
                "$BUILD_DIR" \
                "${{ matrix.arch }}" \
                "$PWD" \
                "$PWD/release_artifacts" \
                "${{ github.ref_name }}" \
                "${{ github.sha }}" \
                "${{ github.run_id }}"
            '

      - name: Print reproducibility hashes
        run: |
          ART="release_artifacts/${{ matrix.arch }}"
          echo "## Reproducibility hashes (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ( cd "$ART" && sha256sum vmlinux vmlinux.dbg kernel_config \
              $( [ -f Image ] && echo Image ) ) | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-build
          path: release_artifacts/${{ matrix.arch }}/

  build_perf:
    name: Build Perf
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: ['x64', 'arm64']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev
          [ "${{ matrix.arch }}" == "arm64" ] && sudo apt-get install -y g++-aarch64-linux-gnu || true

      - name: Run build script
        run: |
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            export makeargs="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-"
            export strip="aarch64-linux-gnu-strip"
          elif [ "${{ matrix.arch }}" == "x64" ]; then
            export makeargs="ARCH=x86_64"
            export strip="strip"
          fi
          make $makeargs \
            NO_ZLIB=1 NO_LIBELF=1 NO_LIBCRYPTO=1 NO_LIBPYTHON=1 NO_JEVENTS=1 NO_LIBTRACEEVENT=1 \
            LDFLAGS=-static -C tools DESTDIR="$PWD/perf-"${{ matrix.arch }}"" perf_install

          $strip perf-"${{ matrix.arch }}"/bin/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.arch }}
          path: perf-${{ matrix.arch }}/

  create_release:
    name: Create GitHub Release
    needs: [build_linux, build_perf]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x64-build
          path: release_artifacts/x64/

      - uses: actions/download-artifact@v4
        with:
          name: cvm-x64-build
          path: release_artifacts/cvm-x64/

      - uses: actions/download-artifact@v4
        with:
          name: arm64-build
          path: release_artifacts/arm64/

      - uses: actions/download-artifact@v4
        with:
          name: perf-x64
          path: perf-x64/

      - uses: actions/download-artifact@v4
        with:
          name: perf-arm64
          path: perf-arm64/

      - name: Archive artifacts
        run: |
          # Install perf
          mkdir release_artifacts/x64/tools
          mkdir release_artifacts/cvm-x64/tools
          mkdir release_artifacts/arm64/tools
          cp -r perf-x64/ release_artifacts/x64/tools/perf/
          cp -r perf-x64/ release_artifacts/cvm-x64/tools/perf/
          cp -r perf-arm64/ release_artifacts/arm64/tools/perf/

          # Archive repo
          kernel_tag="$(echo ${{ github.ref_name }} | sed 's:.*/::g')"
          kern="Kernel"
          echo ${{ github.ref_name }} | grep -q "dev" && kern="Kernel.Dev"
          tar czvf Microsoft.OHCL.$kern.$kernel_tag-x64.tar.gz -C release_artifacts/x64/ .
          tar czvf Microsoft.OHCL.$kern.$kernel_tag-cvm-x64.tar.gz -C release_artifacts/cvm-x64/ .
          tar czvf Microsoft.OHCL.$kern.$kernel_tag-arm64.tar.gz -C release_artifacts/arm64/ .

      - name: Update release notes
        run: |
          rolling_tag="${{ github.ref_name }}"
          kernel_tag="$(make kernelversion)"
          date="$(date +"%B %d %Y")"
          sed -i "s:{{rolling lts tag}}:${rolling_tag}:g" MSFT-Merge/release-notes.md
          sed -i "s:{{LTS Tag}}:${kernel_tag}:g" MSFT-Merge/release-notes.md
          sed -i "s:{{Date}}:${date}:g" MSFT-Merge/release-notes.md

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}/MSFT-Merge/release-notes.md
          draft: false
          files: |
            Microsoft.OHCL.Kernel.*.tar.gz
          token: ${{ secrets.RELEASE_TOKEN }}
